
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Quiz Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">

        <header class="quiz-header">
            <h1>JS Quiz Arena</h1>
            <p>Test your JavaScript knowledge!</p>
        </header>

        <main id="quiz-screen">

            <div class="quiz-info">
                <span id="progress">Q1/25</span>
                <span id="score">Score: 0</span>
                <span id="timer">Time: 30s</span>
            </div>

            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <h2 id="question"></h2>

            <div id="options-container"></div>

            <p id="explanation" class="explanation"></p>

            <div class="button-group">
                <button id="next-btn" disabled>Next →</button>
                <button id="restart-btn" class="secondary-btn">Restart</button>
            </div>

        </main>

        <section id="result-screen" class="hidden">
            <h2>Quiz Completed!</h2>

            <p id="final-score"></p>
            <p id="rating"></p>

            <button id="review-btn">Review Wrong Answers</button>
            <button id="result-restart-btn" class="secondary-btn">
                Restart Quiz
            </button>
        </section>

        <section id="review-screen" class="hidden">
            <h2>Review Wrong Answers</h2>

            <div id="wrong-answers-container"></div>

            <button id="review-restart-btn">Try Again</button>
            <button id="back-btn" class="secondary-btn">
                Back to Results
            </button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
